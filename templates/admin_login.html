<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - UTCN Timetable</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-login">
  <main class="login-shell">
    <section class="login-panel">
      <div class="brand">
        <img src="{{ url_for('static', filename='images/utcn-logo-color.svg') }}" width="86" height="55" alt="UTCN">
        <div>
          <h1>Admin sign in</h1>
          <span class="sub">UTCN Timetable System</span>
        </div>
      </div>
      {% if expired %}
        <div class="notice" role="status">Your session expired; please sign in again.</div>
      {% endif %}
      {% if message %}
        <div class="error" role="alert">{{ message }}</div>
      {% endif %}
      <form method="post" action="/admin/login">
        <input type="hidden" name="csrf_token" value="{{ login_csrf_token }}" />
        <label>Username <input name="username" autocomplete="username" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required/></label>
        <button type="submit">Login</button>
      </form>
      <a href="/" class="back-link">Back to schedule</a>
    </section>
  </main>
</body>
</html>
