<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - UTCN Timetable</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
<meta name="csrf-token" content="{{ csrf_token() }}">
    {% for css in admin_css %}<link rel="stylesheet" href="/{{ css }}">{% endfor %}
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="admin-brand"><img src="{{ url_for('static', filename='images/utcn-logo-color.svg') }}" width="86" height="55" alt="UTCN"><div><span class="product-name">Timetable</span><span class="institution-name">Technical University of Cluj-Napoca</span></div><span class="admin-label">Administration</span></div>
        <a href="/" class="back-link">← Back to Timetable</a>
    </header>
    <main id="admin-root"></main>
    
    {% if admin_asset %}
    <script type="module" src="{{ admin_asset }}"></script>
    {% else %}
    <p>Build the frontend with <code>cd frontend &amp;&amp; npm ci &amp;&amp; npm run build</code> to load the admin panel.</p>
    {% endif %}

</body>
</html>
